name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_CACHE_DIR: .turbo

jobs:
  ci:
    name: Lint, typecheck & test
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Restore Turborepo cache
        uses: actions/cache@v6
        with:
          path: .turbo
          # CLN-060: a key per commit, so every run saves its own cache; restore-keys picks the
          # newest earlier one. (A lockfile-only key was never saved again after the first hit.)
          key: turbo-ci-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-ci-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint & typecheck
        run: pnpm turbo run lint typecheck --continue

      # CLN-060: the backend unit suite runs once, in the coverage step below (it used to run in
      # turbo test and again for coverage). typecheck above already built the workspace deps.
      - name: Test (all packages but the backend)
        if: ${{ !cancelled() }}
        run: pnpm turbo run test --continue --filter='!@power-budget/backend'

      - name: Backend coverage
        if: ${{ !cancelled() }}
        run: pnpm --filter @power-budget/backend test:coverage

      - name: Coverage summary
        if: always()
        run: |
          if [ -f packages/backend/coverage/coverage-summary.json ]; then
            node -e "const t=require('./packages/backend/coverage/coverage-summary.json').total; console.log('## Backend coverage (application layer)\n\n| lines | statements | branches | functions |\n|---|---|---|---|\n| '+[t.lines,t.statements,t.branches,t.functions].map(m=>m.pct+'%').join(' | ')+' |')" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Check OpenAPI spec drift
        run: |
          cd packages/backend && pnpm run generate:openapi && cd ../..
          pnpm exec prettier --write packages/backend/openapi.json
          git diff --exit-code packages/backend/openapi.json

      - name: Check drizzle migration drift
        run: pnpm --filter @power-budget/backend db:check

      - name: Check API types drift
        run: |
          pnpm --filter @power-budget/shared-app codegen
          pnpm exec prettier --write packages/shared-app/src/contract/api-types.ts
          git diff --exit-code packages/shared-app/src/contract/api-types.ts

      - name: Collect coverage reports
        if: always()
        run: find . -name 'lcov.info' -not -path '*/node_modules/*' | xargs -I{} echo "{}"

      - name: Upload coverage artefacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-reports
          path: |
            packages/*/coverage/
          if-no-files-found: ignore

  integration:
    name: Backend integration (Postgres + Redis, testcontainers)
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Docker is preinstalled on ubuntu runners; testcontainers starts
      # postgres:16 and redis:7 itself and applies the drizzle migrations.
      - name: Run backend integration tests
        run: pnpm turbo run test:integration --filter=@power-budget/backend

  e2e:
    # CLN-017: the web app against a real backend. Postgres + Redis from
    # docker/e2e/docker-compose.yml; playwright.config.ts starts the fake Resend API,
    # the backend built from this commit (migrations, app role, seeds, API + worker)
    # and a production build of the web app. Then the k6 gate hits the same backend.
    name: E2E (Playwright + k6, real backend)
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Restore Turborepo cache
        uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-e2e-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-e2e-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start Postgres and Redis
        run: docker compose -f docker/e2e/docker-compose.yml up -d --wait

      - name: Build the backend and the web app's dependencies
        run: pnpm turbo run build --filter=@power-budget/backend --filter=@power-budget/web^...

      # CLN-060: the browser download is cached per Playwright version; the OS packages are
      # not part of ~/.cache/ms-playwright, so install-deps runs on a hit (apt only, no download
      # of the browser). A miss installs both, as before.
      - name: Resolve the Playwright version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
        working-directory: packages/web

      - name: Restore Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium --with-deps
        working-directory: packages/web

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
        working-directory: packages/web

      # DSN-050: the a11y-stack project (axe and keyboard pass on the real pages) reuses the
      # backend, the web build and the browser this job already set up.
      - name: Playwright e2e against the real backend
        run: pnpm exec playwright test --project=chromium --project=a11y-stack
        working-directory: packages/web
        env:
          TEST_ENV: e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            packages/web/playwright-report/
            packages/web/test-results/
          if-no-files-found: ignore

      - name: Install k6
        uses: grafana/setup-k6-action@v1
        with:
          k6-version: '1.3.0'

      # CLN-060: restores the p95 history of earlier runs (newest cache by prefix).
      - name: Restore k6 history
        uses: actions/cache/restore@v6
        with:
          path: perf-history
          key: k6-history-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            k6-history-

      # CLN-060: the gate runs on a user with 5,000 transactions (v2 columns, 70% mapped), seeded
      # by db:seed:k6 through the API (user, plan) and straight into Postgres (rows), and gates
      # GET /transactions (first page, unmappedOnly) next to the dashboard.
      - name: k6 dashboard + transactions gate
        run: |
          bash scripts/e2e-backend.sh > e2e-backend.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -sf http://localhost:3100/health > /dev/null && break
            sleep 1
          done
          pnpm --filter @power-budget/backend db:seed:k6
          k6 run --summary-export=k6-summary.json tests/perf/dashboard.k6.js
        env:
          K6_BASE_URL: http://localhost:3100
          K6_EMAIL: k6-history@e2e.test
          K6_PASSWORD: K6-Str0ng-Pass!
          DATABASE_URL: postgres://power_budget:power_budget@localhost:55432/power_budget

      - name: Append to the k6 history
        if: always()
        run: |
          if [ -f k6-summary.json ]; then
            node tests/perf/append-history.mjs k6-summary.json perf-history/history.jsonl >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Save k6 history
        if: always() && hashFiles('perf-history/history.jsonl') != ''
        uses: actions/cache/save@v6
        with:
          path: perf-history
          key: k6-history-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload k6 summary, history and backend log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: k6-results
          path: |
            k6-summary.json
            e2e-backend.log
            perf-history/history.jsonl
          if-no-files-found: ignore

  visual-web:
    # DSN-011: screenshot + axe checks of the web gallery (no backend). Runs in the Playwright
    # image pinned to the @playwright/test version, the same image `pnpm test:visual` uses
    # locally, so the committed baselines match. Bump the tag with @playwright/test.
    name: Visual (web gallery)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the web app's dependencies
        run: pnpm turbo run build --filter=@power-budget/web^...

      - name: Build the gallery
        run: pnpm run build:gallery
        working-directory: packages/web

      - name: Playwright visual project
        run: pnpm exec playwright test --project=visual
        working-directory: packages/web
        env:
          PW_VISUAL: '1'

      # DSN-050: axe, rendered-text contrast and the keyboard pass on every gallery entry, both themes.
      - name: Playwright a11y project
        run: pnpm exec playwright test --project=a11y
        working-directory: packages/web
        env:
          PW_VISUAL: '1'

      - name: Upload visual diffs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-web-results
          path: packages/web/test-results/
          if-no-files-found: ignore

  visual-mobile:
    # DSN-031: screenshot + axe checks of the mobile gallery (expo export --platform web, no
    # backend), plus the check that the production export contains no gallery. Same pinned
    # Playwright image as visual-web and `pnpm test:visual` in packages/mobile. Bump the tag with
    # @playwright/test.
    name: Visual (mobile gallery)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the mobile app's dependencies
        run: pnpm turbo run build --filter=@power-budget/mobile^...

      - name: Build the gallery
        run: pnpm run build:gallery
        working-directory: packages/mobile

      - name: Production export has no gallery
        run: pnpm run test:export
        working-directory: packages/mobile

      - name: Playwright visual project
        run: pnpm exec playwright test --config e2e-web --project=visual
        working-directory: packages/mobile

      - name: Upload visual diffs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-mobile-results
          path: packages/mobile/test-results/
          if-no-files-found: ignore
