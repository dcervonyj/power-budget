# Throwaway Postgres + Redis for the Playwright e2e and the k6 gate (CLN-017).
# Separate project and ports from the dev stack (docker-compose.yml), data on tmpfs:
#   docker compose -f docker/e2e/docker-compose.yml up -d --wait
#   docker compose -f docker/e2e/docker-compose.yml down -v
# The backend itself runs on the host (packages/web/playwright.config.ts starts it),
# applies the migrations as the owner role and creates the least-privilege app role.
name: pb-e2e

services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_USER: power_budget
      POSTGRES_PASSWORD: power_budget
      POSTGRES_DB: power_budget
    ports:
      - '55432:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U power_budget -d power_budget']
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7.4-alpine
    ports:
      - '56379:6379'
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli ping | grep -q PONG']
      interval: 2s
      timeout: 3s
      retries: 30
